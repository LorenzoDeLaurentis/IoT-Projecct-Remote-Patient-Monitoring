###############################################################################
# docker-compose.yml — IoT Remote Patient Monitoring Platform
###############################################################################
# Services:
#   message_broker        – Eclipse Mosquitto (MQTT broker)
#   health_catalog        – Service & device registry (REST)
#   sensor_connector      – Biometric sensor simulator / Raspberry Pi bridge
#   timeseries_adaptor    – MQTT → SQLite + REST history provider
#   data_processor        – Rolling stats, z-score, trend extraction
#   thingspeak_forwarder  – Rate-limited cloud forwarding to ThingSpeak
#   vital_sign_alert      – Critical health alert control strategy
#   time_based_reminder   – Medication reminder control strategy
#   clinician_portal      – Node-RED UI for healthcare providers
#   patient_bot           – Telegram bot patient interface
###############################################################################

version: '3.9'

services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: message_broker
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    container_name: clinician-portal
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
    restart: unless-stopped

  catalog:
    build: .
    command: python "Catalog_Telegram(new version).py"  # Different from New version
    container_name: catalog
    ports:
      - "8080:8080"
    restart: unless-stopped

  telegram-bot:
    build: .
    command: python patient_controll_telegram.py
    container_name: telegram-bot
    depends_on:
      - catalog
    restart: unless-stopped

  dataprocessor:
    build: .
    command: python dataprocessor.py
    container_name: dataprocessor
    depends_on:
      - catalog
    restart: unless-stopped

  thingspeak_forwarder:
    build: .
    command: python thingspeak_forwarder.py
    container_name: thingspeak_forwarder
    ports:
      - "5004:5004"
    environment:
      HEALTH_CATALOG_URL: http://catalog:8080
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: "1883"
      THINGSPEAK_WRITE_INTERVAL: "15"
    depends_on:
      - catalog
      - mqtt-broker
    restart: unless-stopped

  timeseries-adaptor:
    build: .
    command: python timeseries_adaptor.py
    container_name: timeseries-adaptor
    depends_on:
      - catalog
    restart: unless-stopped

  reminder:
    build: .
    command: python time_based_alert.py
    container_name: reminder
    depends_on:
      - catalog
    restart: unless-stopped

  vital-sign-alert:
    build: .
    command: python vital_sign_alert.py
    container_name: vital-sign-alert
    depends_on:
      - catalog
    restart: unless-stopped

  sensor-connector:
    build: .
    command: python sensor_connector.py
    container_name: sensor-connector
    ports:
      - "5003:5003"
    environment:
      # "true" = frequent episodes for the demo; "false" = realistic frequencies
      SIMULATION_DEMO_MODE: "true"
    depends_on:
      - catalog
      - mqtt-broker
    restart: unless-stopped

volumes:
  node_red_data:
  mosquitto_data:
    external: true
